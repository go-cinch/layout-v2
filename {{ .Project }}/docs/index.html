<!-- HTML for static distribution bundle build -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Computed.service_name_capitalized}} API Docs</title>
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }

    *,
    *:before,
    *:after {
      box-sizing: inherit;
    }

    body {
      margin: 0;
      background: #fafafa;
    }

    #docs-error {
      display: none;
      margin: 24px;
      padding: 16px 18px;
      border: 1px solid #f3b4ae;
      border-radius: 4px;
      background: #fff5f5;
      color: #b42318;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 600;
    }
  </style>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.29.1/swagger-ui.css">
</head>
<body>
  <div id="docs-error"></div>
  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.29.1/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.29.1/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    function showError(message) {
      const error = document.getElementById("docs-error");
      error.textContent = message;
      error.style.display = "block";
    }

    async function loadSpecs() {
      const response = await fetch("./specs.json", { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Failed to load specs.json (${response.status})`);
      }

      const specs = await response.json();
      if (!Array.isArray(specs) || specs.length === 0) {
        throw new Error("specs.json does not contain any specs");
      }

      return specs.map((spec) => ({
        name: spec.name,
        url: spec.url
      }));
    }

    window.onload = async function () {
      try {
        const urls = await loadSpecs();

        window.ui = SwaggerUIBundle({
          urls: urls,
          dom_id: "#swagger-ui",
          deepLinking: true,
          docExpansion: "list",
          persistAuthorization: true,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset
          ],
          plugins: [
            SwaggerUIBundle.plugins.DownloadUrl
          ],
          layout: "StandaloneLayout"
        });
      } catch (error) {
        showError(`Failed to load API documentation: ${error.message}`);
      }
    };
  </script>
</body>
</html>
